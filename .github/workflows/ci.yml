name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Chromium and its system libraries come preinstalled in the official
    # Playwright image (tag must match the playwright version in package-lock),
    # so there is no multi-minute `playwright install --with-deps` step.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Type check
        run: npx vue-tsc -b --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: E2E and server tests (throwaway backend + production build)
        run: scripts/verify.sh --only e2e,server
        env:
          VERIFY_E2E_FILE_TIMEOUT: 1200

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .verify/runs/
          retention-days: 7

      - name: Upload build artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
